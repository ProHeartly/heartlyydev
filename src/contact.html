<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% set title = "Heartlyy | Contact me" %}
    {% set desc = "Heyy! you can find my contacts or drop a msg directly to my inbox." %}
    {% include "meta.html" %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/static/contact_style.css">
</head>
<body>
    <header class="top">
        <a href="/" class="back"><i class="ph-duotone ph-arrow-left"></i> <span>back</span></a>
        <button type="button" class="theme-btn" id="theme-toggle">
            <i class="ph-duotone ph-moon" id="theme-icon"></i>
        </button>
    </header>

    <h1>Contact me</h1>

    <main class="contact">
        <div class="dial" tabindex="0">
            <div class="ring"></div>
            <div class="center"></div>
            <svg class="stop" viewBox="0 0 40 36"> <path d="M5 5 H35 L20 31 Z"/></svg>
        </div>
        <div class="card"></div>
    </main>

    <template id="message-box">
        <form class="message">
            <textarea name="msg" placeholder="say hi, or anything.." maxlength="2000" required></textarea>
            <input type="text" name="reply" placeholder="where do you expect a reply? (your email, optional)" maxlength="200">
            <input name="website" class="ho" tabindex="-1" autocomplete="off">
            <button type="submit" class="act">send</button>
        </form>
    </template>

    <script src="/static/scroll.js"></script>
    <script src="/static/theme.js"></script>
    <script src="/static/contact.js"></script>
</body>
</html>
