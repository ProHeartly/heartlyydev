<title>{{ title }}</title>
<meta name="description" content="{{ desc }}">
<link rel="canonical" href="https://heartlyy.dev{{ request.url.path | urlencode }}">

<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#09002f">

<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ desc }}">
<meta property="og:image" content="https://heartlyy.dev/static/og.png">
<meta property="og:image:height" content="630">
<meta property="og:image:width" content="1200">
<meta property="og:url" content="https://heartlyy.dev{{ request.url.path }}">
<meta property="og:image:alt" content="heartlyy.dev, Rasim's corner of the internet">
<meta property="og:type" content="{{ type or 'website' }}">
<meta name="twitter:card" content="summary_large_image">
