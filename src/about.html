<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartlyy | About me</title>
    <link rel="stylesheet" href="/static/about_style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <header class="top">
        <a href="/" class="back"><i class="ph-duotone ph-arrow-left"></i> back</a>

        <div class="picker">
            <p>How much time do you have?</p>
            <div class="levels">
                <button data-level="l1">5 sec</button>
                <button data-level="l2">30 sec</button>
                <button data-level="l3">5 min</button>
            </div>
        </div>

        <button id="theme-toggle" class="theme-btn" type="button">
            <i id="theme-icon" class="ph-duotone ph-moon"></i>
        </button>
    </header>


    <script src="/static/theme.js"></script>
</body>
</html>
