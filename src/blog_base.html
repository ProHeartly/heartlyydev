<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blogs{% endblock %} | The Heartlyy Times</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Space+Grotesk:wght@300..700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/duotone/style.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/blog.css">
</head>
<body>
    <div class="paper">
        <header class="masthead">
            <div class="masthead-top">
                <a href="/" class="mast-link"><i class="ph-duotone ph-house"></i> Home</a>
                <span class="mast-date">{{ today }}</span>
                <button id="theme-toggle" class="theme-btn" type="button"><i id="theme-icon" class="ph-duotone ph-moon"></i></button>
            </div>
            <a href="/blogs" class="nameplate">The Heartlyy Times</a>
            <div class="mast-rule">
                <span>{% block edition %}Hope you enjoy here{% endblock %}</span>
            </div>
        </header>

        <main class="paper-main">
            {% block content %} {% endblock %}
        </main>

        <footer class="paper-foot">
            <span>The Heartlyy Times</span>
            <span>.</span>
            <a href="/">heartlyy.dev</a>
        </footer>
    </div>

    <script src="/static/theme.js"></script>
</body>
</html>
