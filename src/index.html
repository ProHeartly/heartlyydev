<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartly</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="main">
        <div class="row">
            <a class="card a">
                <p id="what" class="what hidden">I'm listening to</p>
                <button id="listen-btn" class="listen-btn">
                    <i class="ph-duotone ph-play" id="listen-icon"></i>
                    <span id="listen-text">Search this song</span>
                </button>
                <div class="track-back" id="track-back">Connecting to da thing</div>
                <div class="record-wrapper" id="record-wrapper">
                    <div class="record" id="record">
                        <div class="label" id="label"></div>
                    </div>
                </div>
                <div class="track-front" id="track-front">Connecting to da thing</div>
            </a>
            <a class="card b">
                <h1>My Projects</h1>
                <p>Maybe you would like some</p>
            </a>
            <a class="card e">
                <h1>Blogs</h1>
                <p>Posts by me</p>
            </a>
            <div class="card f" id="theme-toggle">
                <i id="theme-icon" class="ph-duotone ph-moon"></i>
            </div>
        </div>
        <div class="row">
            <a href="https://github.com/ProHeartly/" target="_blank" rel="noopener" class="card c">
                <i class="ph-duotone ph-github-logo"></i>
                <p>My github</p>
            </a>
            <a href="/about" class="card d">
                <h1>About me</h1>
                <p>Who am I?</p>
            </a>
            <a href="/gallery" class="card g">
                <h1>My gallery</h1>
                <p>Photos that seems random</p>
            </a>
            <a class="card h">
                <h1>Contact me</h1>
                <p>My contacts, msg me and lets have some chitchats</p>
            </a>
        </div>
    </div>

    <script src="/static/mini_music.js"></script>
    <script src="/static/animation.js"></script>
    <script src="/static/theme.js"></script>
    <script src="/static/scroll.js"></script>
</body>
</html>
